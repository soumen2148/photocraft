name: Build Custom PhotoCraft AI (Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ai-smart-selection

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 Release (AI Smart Selection)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: "true"

      - name: Run AI segmentation unit tests (Release profile)
        run: |
          cargo test --release --lib -p photocraft-engine ai_segment -- --nocapture
          cargo test --release --lib -p photocraft-automation ai_segment -- --nocapture

      - name: Build PhotoCraft Desktop & CLI (Release)
        run: cargo build --release -p photocraft -p photocraft-cli --features heif

      - name: Upload Ready-to-Run Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-AI-Windows-x64
          path: |
            target/release/photocraft.exe
            target/release/photocraft-cli.exe
          if-no-files-found: error
